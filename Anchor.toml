[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
tuk_tuk_scheduled_vrf = "hS5bMz3KJtAfN5fHsXn8HGsNt64diPwPzCeyHLbo8jZ"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
cron = "yarn run ts-node cron/cron.ts --cronName tuktuk-counter-cron --queueName vrf-Queue --walletPath ~/.config/solana/id.json --rpcUrl https://api.devnet.solana.com"
